<!DOCTYPE html>
<html lang="en"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
        xmlns:f="jakarta.faces.core"
        xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Jakarta Facelets and JNDI DataSources</title>
    </h:head>
    <h:body>
        <h2>Refresh</h2>
        <h:form>
            <h:commandButton value="Refresh" action="#{messages.pullLog}">
                <f:ajax execute="@this" render=":chatLog"/>
            </h:commandButton>
            <h:messages />
        </h:form>

        <h2>Post a Message</h2>
        <h:form>
            <h:inputText value="#{messages.message}" required="true"/>
            <h:commandButton value="Send" action="#{messages.postMessage}">
                <f:ajax execute="@form" render=":chatLog"/>
            </h:commandButton>
            <h:messages />
        </h:form>
        
        <h:panelGroup id="chatLog">
            <ui:repeat value="#{messages.chatLog}" var="p">
                <p>#{p}</p>
            </ui:repeat>
        </h:panelGroup>
    </h:body>
</html>
